<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta
      name="description"
      content="FigJam のように直感的に使える draw.io 互換の図解エディタ"
    />
    <title>Dorojam — 図解エディタ</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='16' fill='%235b45e8'/%3E%3Cpath d='M19 21h19a10 10 0 0 1 0 20H19z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3Ccircle cx='46' cy='43' r='5' fill='%23ffbd59'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand" aria-label="Dorojam">
          <span class="brand-mark">D<span></span></span><strong>Dorojam</strong>
        </div>
        <span class="top-divider"></span>
        <input
          id="docTitle"
          class="doc-title"
          aria-label="ファイル名"
          value="無題のボード"
          spellcheck="false"
        />
        <span id="saveStatus" class="save-status">保存済み</span>
        <div class="top-spacer"></div>
        <button
          id="undoBtn"
          class="icon-button"
          title="元に戻す"
          aria-label="元に戻す"
        >
          ↶
        </button>
        <button
          id="redoBtn"
          class="icon-button"
          title="やり直す"
          aria-label="やり直す"
        >
          ↷
        </button>
        <span class="top-divider"></span>
        <button id="shortcutsBtn" class="top-button">
          ⌨ <span>ショートカット</span>
        </button>
        <button id="fileBtn" class="top-button">
          ファイル <span class="chevron">⌄</span>
        </button>
        <button id="exportBtn" class="primary-button">書き出す</button>
      </header>

      <main id="workspace" class="workspace" aria-label="図解キャンバス">
        <div id="grid" class="grid"></div>
        <svg id="canvas" class="canvas" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker
              id="arrow"
              markerWidth="10"
              markerHeight="10"
              refX="8"
              refY="5"
              orient="auto"
              markerUnits="strokeWidth"
            >
              <path
                d="M0 0 L10 5 L0 10"
                fill="none"
                stroke="#596079"
                stroke-width="1.6"
              />
            </marker>
          </defs>
          <g id="scene"></g>
          <g id="overlay"></g>
        </svg>
        <div id="emptyHint" class="empty-hint">
          <span>ここから自由に描き始めましょう</span
          ><small
            >左のツールから図形を選ぶか、キャンバスをダブルクリックしてテキストを追加</small
          >
        </div>

        <div class="toolbar" role="toolbar" aria-label="作成ツール">
          <button
            class="tool active"
            data-tool="select"
            title="選択"
            aria-label="選択"
          >
            <svg viewBox="0 0 24 24"><path d="m5 3 13 9-7 1-3 6z" /></svg
            ><kbd>V</kbd>
          </button>
          <button
            class="tool"
            data-tool="hand"
            title="手のひら"
            aria-label="手のひら"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M8 12V5a1.5 1.5 0 0 1 3 0v6-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v5-2a1.5 1.5 0 0 1 3 0v5c0 5-3 7-7 7h-1c-3 0-5-2-7-5l-2-3a1.5 1.5 0 0 1 2.5-1.5L8 15"
              /></svg
            ><kbd>H</kbd>
          </button>
          <span class="tool-divider"></span>
          <button
            class="tool"
            data-tool="rect"
            title="四角形"
            aria-label="四角形"
          >
            <svg viewBox="0 0 24 24">
              <rect x="4" y="5" width="16" height="14" rx="2" /></svg
            ><kbd>R</kbd>
          </button>
          <button
            class="tool"
            data-tool="ellipse"
            title="円形"
            aria-label="円形"
          >
            <svg viewBox="0 0 24 24">
              <ellipse cx="12" cy="12" rx="8" ry="7" /></svg
            ><kbd>O</kbd>
          </button>
          <button
            class="tool"
            data-tool="diamond"
            title="ひし形"
            aria-label="ひし形"
          >
            <svg viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z" /></svg
            ><kbd>D</kbd>
          </button>
          <button
            class="tool"
            data-tool="sticky"
            title="付箋"
            aria-label="付箋"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 4h16v12l-4 4H4zM16 20v-4h4" /></svg
            ><kbd>S</kbd>
          </button>
          <button
            class="tool"
            data-tool="section"
            title="セクション"
            aria-label="セクション"
          >
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M3 9h18" /></svg
            ><kbd>⇧S</kbd>
          </button>
          <button
            class="tool"
            data-tool="text"
            title="テキスト"
            aria-label="テキスト"
          >
            <svg viewBox="0 0 24 24"><path d="M4 6h16M12 6v13M8 19h8" /></svg
            ><kbd>T</kbd>
          </button>
          <span class="tool-divider"></span>
          <button
            class="tool"
            data-tool="connector"
            title="コネクタ"
            aria-label="コネクタ"
          >
            <svg viewBox="0 0 24 24"><path d="M4 18 18 6M13 6h5v5" /></svg
            ><kbd>C</kbd>
          </button>
        </div>

        <nav class="page-bar" aria-label="ページ">
          <select id="pageSelect" aria-label="表示するページ"></select>
          <button
            id="addPageBtn"
            type="button"
            title="ページを追加"
            aria-label="ページを追加"
          >
            ＋
          </button>
          <button
            id="renamePageBtn"
            type="button"
            title="ページ名を変更"
            aria-label="ページ名を変更"
          >
            ✎
          </button>
          <button
            id="deletePageBtn"
            type="button"
            title="ページを削除"
            aria-label="ページを削除"
          >
            ×
          </button>
        </nav>

        <div id="inspector" class="inspector hidden">
          <div class="inspector-heading">
            <strong id="inspectorTitle">図形</strong
            ><span id="selectionCount"></span>
          </div>
          <label class="field-label">塗り</label>
          <div id="fillColors" class="swatches"></div>
          <label class="field-label">線</label>
          <div id="strokeColors" class="swatches"></div>
          <label class="field-label" for="textSize">文字サイズ</label
          ><select id="textSize">
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="24">24</option>
            <option value="30">30</option>
          </select>
          <div class="inspector-actions">
            <button id="duplicateBtn">複製</button
            ><button id="deleteBtn">削除</button>
          </div>
          <button id="registerShapeBtn" class="register-shape">
            この図形をショートカットに登録
          </button>
        </div>

        <div class="zoom-bar">
          <button id="zoomOut" aria-label="縮小">−</button
          ><button id="zoomValue" title="100% に戻す">100%</button
          ><button id="zoomIn" aria-label="拡大">＋</button><span></span
          ><button id="fitBtn" title="全体を表示">⌗</button>
        </div>
        <div class="canvas-tip">
          Space + ドラッグで移動 · Ctrl + ホイールで拡大
        </div>
      </main>
    </div>

    <div id="fileMenu" class="popover hidden">
      <button data-file="new">新しいボード <kbd>Ctrl N</kbd></button
      ><button data-file="open">draw.io を開く <kbd>Ctrl O</kbd></button
      ><button data-file="save">draw.io で書き出す <kbd>Ctrl S</kbd></button
      ><button data-file="svg">SVG で書き出す</button
      ><button data-file="png">PNG で書き出す</button>
    </div>
    <input
      id="fileInput"
      type="file"
      accept=".drawio,.xml,text/xml,application/xml"
      hidden
    />
    <div id="toast" class="toast hidden" role="status"></div>

    <div
      id="shortcutDialog"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="shortcutTitle"
    >
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2 id="shortcutTitle">ショートカット</h2>
            <p>キーをクリックしてから、新しい組み合わせを押してください。</p>
          </div>
          <button id="closeShortcuts" class="close-button" aria-label="閉じる">
            ×
          </button>
        </div>
        <div class="shortcut-rows">
          <div class="preset-heading">
            <strong>登録した図形</strong
            ><span>キーで配置ツールを呼び出せます</span>
          </div>
          <div id="presetRows"></div>
          <div class="preset-form">
            <input
              id="presetName"
              type="text"
              placeholder="図形の名前"
              aria-label="登録する図形の名前"
            /><select id="presetType" aria-label="図形の種類">
              <option value="rect">四角形</option>
              <option value="ellipse">円形</option>
              <option value="diamond">ひし形</option>
              <option value="sticky">付箋</option>
              <option value="section">セクション</option>
              <option value="text">テキスト</option></select
            ><button id="addPreset">登録</button>
          </div>
          <div class="preset-heading builtins-heading">
            <strong>基本操作</strong>
          </div>
          <div id="shortcutRows"></div>
        </div>
        <div class="modal-foot">
          <button id="resetShortcuts">初期設定に戻す</button
          ><button id="doneShortcuts" class="primary-button">完了</button>
        </div>
      </div>
    </div>
    <textarea
      id="textEditor"
      class="text-editor hidden"
      spellcheck="false"
      aria-label="テキストを編集"
    ></textarea>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
